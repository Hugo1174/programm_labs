name: C++_Lab2_Full_CI

on:
  push:
    branches:
      - lab2
  pull_request:
    branches:
      - lab2

jobs:
  build_and_test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Установка Google Test только для Ubuntu
      - name: Install Google Test (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev cmake
          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib

      # Сборка основного приложения
      - name: Compile Project
        run: g++ -std=c++14 ip_filter.cpp -o ip_filter

      # Сборка и запуск Unit-тестов (только на Ubuntu для простоты)
      - name: Compile and Run Unit Tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          g++ -std=c++14 tests.cpp -o run_tests -lgtest -lpthread
          ./run_tests

      # Интеграционный тест (проверка на реальном файле)
      - name: Run IP Filter Integration Test
        run: |
          ./ip_filter < ip_filter.tsv > result.out
          echo "--- Top 10 sorted IP addresses ---"
          head -n 10 result.out

      # Сохранение бинарного файла как артефакта
      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: ip_filter