name: Lab2_CI

on:
  push:
    branches:
      - lab2

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: System Info
        run: uname -a

      - name: Compile
        # Используем стандарт C++14 для поддержки auto в лямбдах
        run: g++ -std=c++14 ip_filter.cpp -o ip_filter

      - name: Test Run
        run: |
          # Запуск программы с входными данными
          ./ip_filter < ip_filter.tsv > result.tsv
          echo "Success! Preview of results:"
          head -n 20 result.tsv

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ip_filter_bin_${{ matrix.os }}
          path: ip_filter