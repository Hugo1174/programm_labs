name: C++_Lab2_Full_CI

on:
  push:
    branches:
      - lab2
  pull_request:
    branches:
      - lab2

jobs:
  build_and_test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Установка Google Test для Ubuntu
      - name: Install Google Test (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev cmake
          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib

      # Установка Google Test для macOS
      - name: Install Google Test (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install googletest

      # Сборка основного приложения
      - name: Compile Project
        run: g++ -std=c++14 ip_filter.cpp -o ip_filter

      # Сборка и запуск Unit-тестов
      - name: Compile and Run Unit Tests
        run: |
          g++ -std=c++14 tests.cpp -o run_tests -lgtest -lgtest_main -lpthread
          ./run_tests

      # Интеграционный тест
      - name: Run IP Filter Integration Test
        run: |
          ./ip_filter < ip_filter.tsv > result.out
          head -n 10 result.out

      # Сохранение бинарника
      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ip_filter-${{ matrix.os }}
          path: ip_filter

  release:
    needs: build_and_test
    # Создаем релиз только при пуше в ветку (не при pull request)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Ubuntu Artifact
        uses: actions/download-artifact@v4
        with:
          name: ip_filter-ubuntu-latest
          path: ./ubuntu

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ip_filter-macos-latest
          path: ./macos

      - name: Prepare assets
        run: |
          cp ubuntu/ip_filter ./ip_filter-linux
          cp macos/ip_filter ./ip_filter-macos
          chmod +x ip_filter-linux ip_filter-macos

      - name: Create Automatic Release
        uses: softprops/action-gh-release@v2
        with:
          # Автоматически генерируем имя тега на основе номера запуска
          tag_name: "v0.1.${{ github.run_number }}"
          name: "Release v0.1.${{ github.run_number }}"
          body: |
            Автоматическая сборка Lab 2.
            Дата: ${{ github.event.head_commit.timestamp }}
            Коммит: ${{ github.sha }}
          files: |
            ip_filter-linux
            ip_filter-macos
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}