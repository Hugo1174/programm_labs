name: C++_Lab2_Full_CI

on:
  push:
    branches:
      - lab2
  pull_request:
    branches:
      - lab2

jobs:
  build_and_test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Установка Google Test для Ubuntu
      - name: Install Google Test (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev cmake
          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib

      # Установка Google Test для macOS через Homebrew
      - name: Install Google Test (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install googletest

      # Сборка основного приложения (используем C++17)
      - name: Compile Project
        run: g++ -std=c++17 ip_filter.cpp -o ip_filter

      # Сборка и запуск Unit-тестов для Ubuntu
      - name: Compile and Run Unit Tests (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          g++ -std=c++17 tests.cpp -o run_tests -lgtest -lpthread
          ./run_tests

      # Сборка и запуск Unit-тестов для macOS (с C++17 и путями к brew)
      - name: Compile and Run Unit Tests (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          g++ -std=c++17 tests.cpp -o run_tests -I$(brew --prefix)/include -L$(brew --prefix)/lib -lgtest -lgtest_main -lpthread
          ./run_tests

      # Интеграционный тест (проверка на реальном файле)
      - name: Run IP Filter Integration Test
        run: |
          ./ip_filter < ip_filter.tsv > result.out
          echo "--- Top 10 sorted IP addresses ---"
          head -n 10 result.out

      # Переименовываем бинарник, чтобы избежать конфликтов имен в релизе
      - name: Prepare binary for release
        run: mv ip_filter ip_filter-${{ matrix.os }}

      # Сохранение бинарного файла как артефакта
      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: ip_filter-${{ matrix.os }}

  # Джоба для автоматического создания релиза
  release:
    name: Create Release
    needs: build_and_test
    runs-on: ubuntu-latest
    # Релиз создается только при пуше в ветку lab2
    if: github.event_name == 'push' && github.ref == 'refs/heads/lab2'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }}"
          files: |
            artifacts/binary-ubuntu-latest/ip_filter-ubuntu-latest
            artifacts/binary-macos-latest/ip_filter-macos-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}